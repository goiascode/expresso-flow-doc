site_name: Expresso Flow
site_description: Framework Python para construção de fluxos de comunicação em canais como WhatsApp, Telegram, ChatWeb e outros.
site_url: https://exflow.run
site_author: Expresso Flow Team
repo_url: https://github.com/expresso-flow/expresso-flow
repo_name: expresso-flow/expresso-flow
edit_uri: ""

copyright: Copyright &copy; 2024 - 2025 Expresso Flow

theme:
  name: material
  language: pt-BR
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    scheme: default
    primary: blue
    accent: blue
  font:
    text: Inter
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
    - toc.integrate

plugins:
  - search:
      lang: pt
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: Nesta página
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/expresso-flow/expresso-flow
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/expresso-flow/
      name: PyPI
    - icon: fontawesome/brands/discord
      link: https://discord.gg/exflow
      name: Discord
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  annotate:
    json: [.s2]

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/extra.js

nav:
  - Home: index.md
  - Começando:
    - 2_getting_started/index.md
    - Instalação: 2_getting_started/installation.md
    - Quick Start: 2_getting_started/quick-start.md
    - Primeiro Fluxo: 2_getting_started/first-flow.md
  - Downloads: 3_downloads/index.md
  - ExpressoFlow:
    - 4_expresso_flow/index.md
    - Bootstrap: 4_expresso_flow/bootstrap.md
    - Bundles: 4_expresso_flow/bundles.md
    - Flows:
        - Flow:
            - 4_expresso_flow/flow.md
            - Session: 4_expresso_flow/session.md
            - Steps: 4_expresso_flow/steps.md
            - Execution Actions: 4_expresso_flow/actions.md
        - MetaFlow:
            - 4_expresso_flow/metaflow/index.md
            - Model: 4_expresso_flow/metaflow/model.md
            - Fields: 4_expresso_flow/metaflow/fields.md
            - Validators: 4_expresso_flow/metaflow/validators.md
            - Resolvers: 4_expresso_flow/metaflow/resolvers.md
            - Steps: 4_expresso_flow/metaflow/steps.md
            - Exemplo completo: 4_expresso_flow/metaflow/example.md
        - Provider:
            - Provider (exemplo): 4_expresso_flow/provider.md
        - InteractionContext:
            - 4_expresso_flow/interaction/message.md
            - 4_expresso_flow/interaction/output.md
            - 4_expresso_flow/interaction/console.md
            - 4_expresso_flow/interaction/media.md
        - Paginator List:
            - 4_expresso_flow/paginator/paginator.md
        - Texto Inteligente:
            - 4_expresso_flow/intelligent_text/comparador_textual.md
        - Tests:
            - 4_expresso_flow/tests/tests_mock.md
        - Tratamento de Falhas:
            - 4_expresso_flow/tratamento_falhas/step_safe.md
    - Canais:
      - 4_expresso_flow/channels/index.md
      - WhatsApp: 4_expresso_flow/channels/whatsapp.md
      - WebFlow: 6_webflow/index.md
    - Configuração: 4_expresso_flow/configuration.md
    - Pacotes e Agentes: 4_expresso_flow/packages.md
  - CLI:
    - 5_cli/index.md
    - Instalação: 5_cli/installation.md
    - Configuração: 5_cli/configuration.md
    - Comandos:
      - 5_cli/commands/index.md
      - exflow add: 5_cli/commands/add.md
      - exflow build: 5_cli/commands/build.md
      - exflow config: 5_cli/commands/config.md
      - exflow create: 5_cli/commands/new.md
      - exflow download: 5_cli/commands/download.md
      - exflow publish: 5_cli/commands/publish.md
      - exflow run: 5_cli/commands/run.md
  - WebFlow:
    - 6_webflow/index.md
    - Instalação: 6_webflow/installation.md
    - Configuração: 6_webflow/configuration.md
    - Interface: 6_webflow/interface.md
    - Depuração: 6_webflow/debugging.md
  - Referência de API:
    - 7_referencia_api/index.md
    - exflow.application.bootstrap: 7_referencia_api/expresso-flow.md
    - exflow.flow: 7_referencia_api/flow.md
    - exflow.interaction: 7_referencia_api/step.md
    - exflow.execution_action: 7_referencia_api/bundle.md
    - exflow.application.bundle: 7_referencia_api/channel.md
  - Changelog: changelog.md
